name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Local AI artifacts
        uses: actions/cache@v4
        with:
          path: build/.local-ai-cache
          key: local-ai-${{ runner.os }}-qwen3-0.6b-q8_0-${{ hashFiles('scripts/prepare-local-ai.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Require Windows signing certificate
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw 'Missing WINDOWS_CERTIFICATE_BASE64 secret.' }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'Missing WINDOWS_CERTIFICATE_PASSWORD secret.' }

      - name: Package installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run build:win -- --publish never

      - name: Verify installer signature
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = "release/shengciben-setup-$version.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status), expected Valid." }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          gh release create "$tag" --title "生词本 $tag" --notes "自动发布" 2>$null
          gh release upload "$tag" "release/shengciben-setup-$version.exe" "release/shengciben-setup-$version.exe.blockmap" "release/latest.yml" --clobber
