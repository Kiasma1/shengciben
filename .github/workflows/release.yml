name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package installer
        run: npm run build:win -- --publish never

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          gh release create "$tag" --title "生词本 $tag" --notes "自动发布" 2>$null
          gh release upload "$tag" "release/shengciben-setup-$version.exe" "release/shengciben-setup-$version.exe.blockmap" "release/latest.yml" --clobber
